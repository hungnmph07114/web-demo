version: '3.8'

services:
  # =========================================================================
  # 🚀 TechPulse Unified Application Service (Express API + React SPA)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techpulse-ecommerce
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/techpulse_db}
      - JWT_SECRET=${JWT_SECRET:-techpulse_secret_key_production_2026}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =========================================================================
  # 🐘 Local PostgreSQL Database (Dành cho chạy offline không cần Supabase)
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: techpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-techpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
